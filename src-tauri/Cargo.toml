[package]
name = "rich2-patch"
version = "1.0.0"
description = "大富翁2 Patch"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# 這是要發佈給人下載的桌面工具，體積比編譯時間重要。與 RICH2_EDITOR 同一組設定。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
